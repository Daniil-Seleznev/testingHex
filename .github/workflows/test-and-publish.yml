name: Tests

on:
  push:
    branches:
      - source

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish to main
        run: |
          git fetch origin

          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git checkout main
          else
            git checkout -b main
          fi

          git checkout source -- .

          cat > src/sum.js << 'EOF'
          function sum(a, b) {
            throw new Error('Not implemented');
          }

          module.exports = sum;
          EOF

          git add .
          git commit -m "Publish task" || true
          git push origin main